<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Watch Party was removed</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6.5' fill='%23f0a33c'/%3E%3Crect x='4.5' y='5.5' width='15' height='10.5' rx='2.2' fill='none' stroke='%233a2c20' stroke-width='1.8'/%3E%3Cpath d='M10.3 8.6l4.3 2.1-4.3 2.1z' fill='%233a2c20'/%3E%3Cpath d='M8 19.5h8' stroke='%233a2c20' stroke-width='1.8' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script defer src="https://cloud.umami.is/script.js" data-website-id="328e350f-b770-4529-9500-92b514123a6c"></script>
<style>
  /* The tokens of the approved mockup (design/watch-party.dc.html, v3), the same ones the invite
     page j/ is built from, so all four pages of the product read as one. */
  :root {
    --bg: oklch(98.6% 0.004 80); --card: oklch(95.8% 0.007 78); --line: oklch(90.5% 0.009 75);
    --fg: oklch(24% 0.013 60); --muted: oklch(52% 0.013 65);
    --accent: oklch(78% 0.155 72); --accent-ink: oklch(50% 0.12 60); --ok: oklch(58% 0.13 150);
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.55 "Instrument Sans", -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .shell { max-width: 780px; margin: 0 auto; padding: 24px 20px 56px; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  .mark { width: 32px; height: 32px; flex: none; }
  .brand { font-weight: 600; font-size: 18px; }
  h1 { font-size: 30px; line-height: 1.15; letter-spacing: -0.02em; margin: 0 0 6px; }
  .lead { color: var(--muted); font-size: 17px; margin: 0 0 22px; }
  .ok { display: inline-flex; align-items: center; gap: 8px; color: var(--ok); font-weight: 600; font-size: 15px; margin-bottom: 6px; }
  ol.steps { list-style: none; padding: 0; margin: 0; display: grid; gap: 24px; }
  .step h2 { display: flex; gap: 12px; align-items: center; font-size: 18px; line-height: 1.3; margin: 0 0 10px; letter-spacing: -0.01em; }
  .step h2.pair { margin-bottom: 6px; }
  .num { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: oklch(23% 0.04 60); display: grid; place-items: center; font-size: 15px; font-weight: 700; }
  .shot { display: block; width: 100%; max-width: 640px; height: auto; border-radius: 16px; }
  .after { margin-top: 28px; padding: 20px 22px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); color: var(--muted); }
  .after b { color: var(--fg); }
  footer { margin-top: 56px; color: var(--muted); font-size: 14px; display: flex; gap: 20px; flex-wrap: wrap; }
  footer a { color: var(--muted); }
  @media (max-width: 560px) { h1 { font-size: 26px; } .step h2 { font-size: 17px; } }

  form { display: grid; gap: 10px; max-width: 560px; }
  .reason { display: flex; align-items: center; gap: 10px; padding: 13px 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); cursor: pointer; font-size: 16px; }
  .reason:hover { border-color: var(--accent-ink); }
  .reason input { accent-color: var(--accent-ink); width: 17px; height: 17px; margin: 0; flex: none; }
  textarea { width: 100%; min-height: 96px; padding: 13px 16px; border: 1px solid var(--line); border-radius: var(--radius); background: oklch(100% 0 0); color: var(--fg); font: inherit; font-size: 16px; resize: vertical; }
  textarea:focus-visible, .reason:focus-within { outline: 2px solid var(--accent-ink); outline-offset: 1px; }
  button { justify-self: start; height: 46px; padding: 0 20px; border: 1px solid var(--accent); border-radius: var(--radius); background: var(--accent); color: oklch(23% 0.04 60); font: 600 15px/1 inherit; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  .thanks { display: none; padding: 22px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); }
  .thanks b { display: block; font-size: 20px; margin-bottom: 4px; }
</style>
</head>
<body>
<div class="shell">
  <header>
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
      <rect width="24" height="24" rx="6.5" fill="oklch(78% 0.155 72)"/>
      <rect x="4.5" y="5.5" width="15" height="10.5" rx="2.2" fill="none" stroke="oklch(23% 0.04 60)" stroke-width="1.8"/>
      <path d="M10.3 8.6l4.3 2.1-4.3 2.1z" fill="oklch(23% 0.04 60)"/>
      <path d="M8 19.5h8" stroke="oklch(23% 0.04 60)" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    </svg>
    <span class="brand">Watch Party</span>
  </header>

  <h1>Watch Party was removed</h1>
  <p class="lead">Sorry to see you go. What went wrong? One click helps us fix it.</p>

  <form id="feedback">
    <label class="reason"><input type="radio" name="reason" value="The players drifted out of sync"> The players drifted out of sync</label>
    <label class="reason"><input type="radio" name="reason" value="My friends could not get in"> My friends could not get in</label>
    <label class="reason"><input type="radio" name="reason" value="It stopped working on my streaming site"> It stopped working on my streaming site</label>
    <label class="reason"><input type="radio" name="reason" value="I only needed it once"> I only needed it once</label>
    <textarea name="details" placeholder="Anything else you'd like to tell us? (optional)"></textarea>
    <button type="submit" id="send" disabled>Send feedback</button>
  </form>
  <div class="thanks" id="thanks" role="status"><b>Thank you!</b>Your feedback has been sent.</div>

  <footer>
    <a href="https://github.com/alxrum/watch-party-pages/issues">Report a problem</a>
  </footer>
</div>
<script>
// The Google Form that collects uninstall reasons. Fill both constants in from the form's
// pre-filled link (⋮ → "Get pre-filled link"): FORM_ID out of
// .../forms/d/e/<FORM_ID>/viewform, the entry.<number> parameters out of the query string.
// While they are empty the page thanks the reader and sends nothing.
const FORM_ID = '';
const ENTRY_REASON = '';
const ENTRY_DETAILS = '';

const form = document.getElementById('feedback');
const send = document.getElementById('send');
form.addEventListener('input', () => { send.disabled = !(form.reason.value || form.details.value.trim()); });
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  send.disabled = true;
  if (FORM_ID && ENTRY_REASON) {
    const body = new URLSearchParams();
    body.set(ENTRY_REASON, form.reason.value || '');
    if (ENTRY_DETAILS) body.set(ENTRY_DETAILS, form.details.value.trim());
    try { await fetch(`https://docs.google.com/forms/d/e/${FORM_ID}/formResponse`, { method: 'POST', mode: 'no-cors', body }); } catch (err) { /* the answer is still thanked */ }
  }
  form.style.display = 'none';
  document.getElementById('thanks').style.display = 'block';
});
</script>
</body>
</html>
